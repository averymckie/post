[project]
name = "compiled-ai"
version = "0.2.0"
description = "Source procedures to a cited first-order-logic base: UDPipe parse, compilation operator, Z3 difference logic, forced precedence, sealed manifest."
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.5",
  "pdfplumber==0.11.10",
  "ufal.udpipe==1.4.0.1",
  "z3-solver==5.1.0.0",
  "networkx==3.6.1",
  "pyyaml==6.0.2",
  "clingo==5.8.2",
  "clorm==1.6.3",
  "predpatt @ git+https://github.com/hltcoe/PredPatt.git@34bc751656a0766c7ac233b077ea8511a8004876",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "mypy==2.3.1",
  "types-PyYAML",
  "types-networkx",
]

chain = [
  "docling==2.124.0",
  "docling-core==2.93.0",
  "lxml==6.1.3",
  "markitdown==0.1.7",
  "undoc==0.9.0",
  "firecrawl-anydoc==0.2.4",
  "python-calamine==0.8.2",
  "fastexcel==0.21.0",
  "pyarrow==25.0.1",
  "csvkit==2.2.0",
  "ydata-profiling==4.18.4",
  "sweetviz==2.3.3",
  "setuptools==79.0.1",
  "numpy==2.3.5",
  "PyMuPDF==1.28.2",
  "pypdf==6.16.2",
  "pypdfium2==5.13.0",
  "datamodel-code-generator==0.76.1",
  "typedlogic==0.2.4",
  "Jinja2==3.1.6",
  "prefect==3.8.4",
  "dagster==1.13.20",
  "temporalio==1.32.0",
  "conllu==6.0.0",
  "kuzu==0.11.3",
  "stanza==1.14.0",
  "spacy==3.8.16",
  "timexy==0.1.3",
  "dateparser==1.4.2",
  "holidays==0.103",
  "statsmodels==0.15.0",
  "PySMT==0.9.6",
  "cvc5==1.3.4",
  "unified-planning==1.3.0",
  "up-pyperplan==1.1.0",
  "zen-engine==2.0.2",
  "durable-rules==2.0.28",
  "business-rules==1.1.1",
  "pm4py==2.7.23.8",
  "SpiffWorkflow==3.2.0",
  "openpyxl==3.1.5",
  "XlsxWriter==3.2.9",
  "pandas-xlsx-tables==1.1.2",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "mammoth==1.12.1",
  "office-oxide==0.1.9",
  "markdownify==1.2.3",
  "html2text==2025.4.15",
  "playwright==1.62.0",
  "pandas==2.3.3",
  "duckdb==1.5.5",
  "great-tables==0.24.0",
  "plotly==7.0.0",
  "streamlit==1.63.0",
  "amrlib==0.8.1",
  "penman==1.3.1",
  "amr-logic-converter==0.11.3",
  "unidecode==1.4.0",
  "nltk==3.10.3",
  "pycasbin==2.8.0",
  "python-sat==1.9.dev15",
  "python-constraint2==2.7.3",
  "rdflib==7.6.0",
  "owlready2==0.51",
  "owlrl==7.6.2",
  "lifelines==0.30.3",
  "reliability==0.9.0",
  "snakes==0.9.33",
  "simpn==1.10.0",
  "simpy==4.1.2",
  "pgmpy==1.1.2",
  "dowhy==0.14",
  "pulp==3.3.2",
  "ortools==9.15.6755",
  "criticalpath==0.1.5",
  "most-queue==2.9",
]

[project.scripts]
compiled-ai = "compiled_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compiled_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = [".", "src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/compiled_ai"]

[[tool.mypy.overrides]]
module = ["z3", "z3.*", "ufal", "ufal.*", "predpatt", "predpatt.*", "clorm", "clorm.*", "clingo", "clingo.*"]
ignore_missing_imports = true

[tool.uv]
# predpatt declares `concrete`, which requires networkx<2.8; the chain never imports concrete
override-dependencies = ["networkx==3.6.1"]
