[project]
name = "compiled-ai"
version = "0.1.0"
description = "Compile regulatory text into checked, sealed, deterministic rules. Runtime needs no model."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
  "pydantic==2.13.5",
]

[project.optional-dependencies]
# The compiler runs steps 1-10. The runtime image must not install this group.
compiler = [
  "pdfplumber==0.11.10",
  "spacy==3.8.16",
  "z3-solver==5.1.0.0",
  "networkx==3.6.1",
  "mypy==2.3.1",
  "pyyaml==6.0.2",
]
# The live proposer is the only component that talks to a model.
live = [
  "anthropic==1.3.0",
]
dev = [
  "pytest>=8.4",
  "hypothesis==6.167.1",
]

[project.scripts]
compiled-ai = "compiled_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compiled_ai"]

[tool.pytest.ini_options]
testpaths = ["tests", "packs"]
addopts = "-q -p no:cacheprovider"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/compiled_ai", "packs"]
