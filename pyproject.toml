[project]
name = "compiled-ai"
version = "0.2.0"
description = "Source procedures to a cited first-order-logic base: UDPipe parse, compilation operator, Z3 difference logic, forced precedence, sealed manifest."
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.5",
  "pdfplumber==0.11.10",
  "ufal.udpipe==1.4.0.1",
  "z3-solver==5.1.0.0",
  "networkx==3.6.1",
  "pyyaml==6.0.2",
  "clingo==5.8.2",
  "clorm==1.6.3",
  "predpatt @ git+https://github.com/hltcoe/PredPatt.git@34bc751656a0766c7ac233b077ea8511a8004876",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "mypy==2.3.1",
  "types-PyYAML",
  "types-networkx",
]

[project.scripts]
compiled-ai = "compiled_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compiled_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = [".", "src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/compiled_ai"]

[[tool.mypy.overrides]]
module = ["z3", "z3.*", "ufal", "ufal.*", "predpatt", "predpatt.*", "clorm", "clorm.*", "clingo", "clingo.*"]
ignore_missing_imports = true
