[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "framework-coverage-checker"
version = "0.1.0"
description = "Evidence-preserving finite contract reconstruction checker"
requires-python = ">=3.12"
dependencies = ["clingo==5.8.0", "cvc5==1.3.4", "z3-solver==4.15.3.0", "jsonschema==4.23.0"]

[project.scripts]
fwcheck = "fwcheck.cli:main"

[tool.setuptools.packages.find]
include = ["fwcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
