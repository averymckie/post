# One recorded answer per statement. `provisional: true` means the reviewer is not a named
# person; the build compiles the statement but marks the manifest and every result provisional.
# A named reviewer confirms by setting `reviewer` to their name, `answer` to true or false, and
# `provisional` to false. The examples must match the proposal's examples exactly.
entries:
- id: foia.determination_clock
  sentence_digest: 994ce953c600bbc24c81ac31cfabf26e4eb141edc4c364f3e940dba06ca18f0c
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A request received on a Monday is determined on or before the twentieth working day after that Monday.
  forbidden_example: A request received on a Monday is still undetermined on the twenty-fifth working day after receipt, with
    no extension notice and no tolling.
  note: The rule computes the deadline with the working-day calendar in calendar.py, whose holiday list is cited to 5 U.S.C.
    6103 but was not verified against fetched text in the build session.
- id: foia.comply_reserved
  sentence_digest: 994ce953c600bbc24c81ac31cfabf26e4eb141edc4c364f3e940dba06ca18f0c
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency decides whether to comply with the request.
  forbidden_example: A program, or anyone other than the agency, decides whether to comply with the request.
- id: foia.notice_immediate
  sentence_digest: 994ce953c600bbc24c81ac31cfabf26e4eb141edc4c364f3e940dba06ca18f0c
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency sends the requester the determination on the day it is made.
  forbidden_example: The agency makes a determination and sends no notice to the requester.
  note: The word 'immediately' is a judgment and is not mechanized. The rule checks that a notice exists and is not dated
    before the determination.
- id: foia.notice_reasons
  sentence_digest: dbdd33e9464956d64c48092732261577f81cffbd39f4a7d244c88bcbcd824826
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The notice states the determination and the reasons for it.
  forbidden_example: The notice states only that the request is denied, with no reasons.
- id: foia.notice_liaison
  sentence_digest: 07dc0e9beccc8af047534299322835197b485cbbeaf4295429b6bae08dc2e476
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The notice tells the requester of the right to seek assistance from the agency's FOIA Public Liaison.
  forbidden_example: The notice omits any mention of the FOIA Public Liaison.
- id: foia.adverse_condition
  sentence_digest: 5b98369bcfeef8fecfeb67a70b929ad457284e6adb609f3a89115b69f3900481
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A denial in whole or in part is an adverse determination and the notice carries items (aa) and (bb).
  forbidden_example: A determination to comply in full is treated as adverse, or an adverse determination is sent without
    items (aa) and (bb).
- id: foia.adverse_notice_appeal
  sentence_digest: cc11370794155bd09628d79a162655108e0e7a694ea04440019dc2344458beb1
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: An adverse notice states the right to appeal to the head of the agency within 90 days after the determination.
  forbidden_example: An adverse notice gives the requester 30 days to appeal, or does not mention appeal at all.
- id: foia.appeal_period_reserved
  sentence_digest: cc11370794155bd09628d79a162655108e0e7a694ea04440019dc2344458beb1
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The head of the agency sets the appeal period, and it is 90 days or longer.
  forbidden_example: A program picks the appeal period, or the period set is shorter than 90 days.
- id: foia.adverse_notice_dispute
  sentence_digest: fca89abcc7743330c071ef2b2c045622bc76eb2edc6125161a5ba7f913ae8c5d
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: An adverse notice tells the requester of the right to seek dispute resolution services from the FOIA Public
    Liaison or the Office of Government Information Services.
  forbidden_example: An adverse notice says nothing about dispute resolution services.
- id: foia.appeal_clock
  sentence_digest: 5fbb00947329106b05edd4daacf8cb08d9b2d42df939cdbd34261f232100eeff
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: An appeal received on a Tuesday is determined on or before the twentieth working day after that Tuesday.
  forbidden_example: An appeal received on a Tuesday is still undetermined on the thirtieth working day after receipt with
    no extension notice.
- id: foia.appeal_reserved
  sentence_digest: 5fbb00947329106b05edd4daacf8cb08d9b2d42df939cdbd34261f232100eeff
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The head of the agency decides the appeal.
  forbidden_example: A program decides the appeal, or the record shows the appeal was decided by someone other than the head
    of the agency.
  note: The statute says the appeal is 'to the head of the agency' (item (aa)) and that the agency makes the determination
    on appeal (clause (ii)). The rule routes the decision to the head of the agency. Delegation to a designee comes from agency
    regulations, not from this sentence.
- id: foia.appeal_upheld_notice
  sentence_digest: ebbfae4c61c3055d0d02c3a5cb8f404291914761648fc09a13d537c6cfc47c2b
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The appeal upholds a partial denial, and the notice tells the requester of the provisions for judicial
    review.
  forbidden_example: The appeal upholds the denial, and the notice says nothing about judicial review.
- id: foia.clock_commencement
  sentence_digest: b0ceb1530f9b01d59016e217b50d51029df6c3d650791ab335e0d2993389c733
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A request received by a designated component on the 1st and by the appropriate component on the 5th starts
    the 20-day period on the 5th.
  forbidden_example: A request received by a designated component on the 1st and by the appropriate component on the 15th
    starts the 20-day period on the 15th instead of the 11th.
- id: foia.tolling_limited
  sentence_digest: 3ba1534e5e4cdfd0b97e9201801a3d5bac3756c8bb4092b1af54169c645f8250
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency tolls the period once while awaiting information it reasonably requested from the requester.
  forbidden_example: The agency tolls the period while it searches for the records.
- id: foia.tolling_once
  sentence_digest: f770fd061078a82c991f1c9c2a5f09e8273a58e68ecc57c467bb53b01c78eb51
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: One request for clarifying information tolls the period until the requester responds.
  forbidden_example: A second request for information tolls the period a second time.
- id: foia.tolling_reasonable_reserved
  sentence_digest: f770fd061078a82c991f1c9c2a5f09e8273a58e68ecc57c467bb53b01c78eb51
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency records that its request for information was reasonable, and the tolling stands.
  forbidden_example: Tolling is claimed for a request for information that the agency has not found reasonable.
- id: foia.extension_notice_content
  sentence_digest: 5c2fcb00ef6e8d305d4d81fcb6e7948c5da9534ae612d9e22ae73a7515274aa0
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency extends the deadline by a written notice that states the unusual circumstances and the date
    a determination is expected.
  forbidden_example: The agency extends the deadline without a written notice, or the notice states no circumstances and no
    expected date.
  note: The definition of 'unusual circumstances' in clause (iii) is not compiled in this slice; whether circumstances are
    unusual is routed to the agency.
- id: foia.extension_reserved
  sentence_digest: 5c2fcb00ef6e8d305d4d81fcb6e7948c5da9534ae612d9e22ae73a7515274aa0
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency decides whether unusual circumstances justify an extension.
  forbidden_example: A program decides that circumstances are unusual and extends the deadline on its own.
- id: foia.extension_limit
  sentence_digest: 030f73fde94839ddb0ffbe2f7470a98984d2d6c97677ed30ba6600c558257345
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: An extension notice extends the deadline by eight working days.
  forbidden_example: An extension notice extends the deadline by fifteen working days without an alternative time frame agreed
    under clause (ii).
- id: foia.prompt_release
  sentence_digest: 3df4e96d47e95de9b6b895c46b40286a3e5389b2c0a9f31a8c215d7bbb2477b6
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency decides to comply and makes the records available.
  forbidden_example: The agency decides to comply and the record shows no release of the records.
  note: The word 'promptly' is a judgment and is not mechanized. The rule checks that a release is recorded and is not dated
    before the determination.
- id: foia.denial_names
  sentence_digest: aad3f2c1a72f2581fd635ceef693e3efb8b3be784a4e62db2381b5805857132a
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A denial notice lists the name and title of each person responsible for the denial.
  forbidden_example: A denial notice names no one.
- id: foia.expedited_clock
  sentence_digest: cd19060a99c353e35f166a359e12f0036c4b6612f609d41fefd2b10b1947de5d
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A request for expedited processing made on the 1st is decided, and the requester notified, by the 11th.
  forbidden_example: A request for expedited processing made on the 1st has no decision by the 20th.
  note: This clause requires agency regulations to ensure the 10-day determination; the rule applies it directly.
- id: foia.expedited_reserved
  sentence_digest: cd19060a99c353e35f166a359e12f0036c4b6612f609d41fefd2b10b1947de5d
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency decides whether to provide expedited processing.
  forbidden_example: A program grants or denies expedited processing on its own.
- id: foia.withhold_only_if
  sentence_digest: 67fd20c66bd8d88db52df67ad06c1c378773e61f5420118a32a17092660f607f
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency withholds a record after recording a foreseeable-harm finding, or because disclosure is prohibited
    by law.
  forbidden_example: The agency withholds a record because an exemption could apply, with no harm finding and no legal prohibition.
- id: foia.foreseeable_harm_condition
  sentence_digest: bb2f13545f3ca654d57d673b341aeb8d869ecc3d76c5f499e60f8ad0d770943a
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A withholding rests on a recorded finding that disclosure would harm an interest protected by an exemption.
  forbidden_example: A withholding cites an exemption with no finding about harm.
- id: foia.foreseeable_harm_reserved
  sentence_digest: bb2f13545f3ca654d57d673b341aeb8d869ecc3d76c5f499e60f8ad0d770943a
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency makes the foreseeable-harm finding.
  forbidden_example: A program decides that disclosure would harm an interest protected by an exemption.
- id: foia.prohibited_by_law_condition
  sentence_digest: 833b3dec7157c71141f093c13d793a40966da2dc445d7266a310439de5d30b39
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A withholding rests on a statute that prohibits disclosure.
  forbidden_example: A withholding claims a legal prohibition that the record does not identify.
- id: foia.partial_disclosure_considered
  sentence_digest: a293919ef478d277d52266ccf01621c50c524842064309ca1bb8df43ada0234d
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency finds full disclosure not possible and records that it considered partial disclosure.
  forbidden_example: The agency finds full disclosure not possible and withholds the record in full without considering partial
    disclosure.
- id: foia.full_disclosure_reserved
  sentence_digest: a293919ef478d277d52266ccf01621c50c524842064309ca1bb8df43ada0234d
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency decides whether full disclosure of the record is possible.
  forbidden_example: A program decides that full disclosure is not possible.
- id: foia.segregate_release
  sentence_digest: 6a944755a431121a64ed593fb590b73e5ef923302392fcc62e4ff1af6a91c8ed
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency records a segregability review and releases the nonexempt portions.
  forbidden_example: The agency withholds a record in full with no segregability review.
- id: foia.segregation_steps_reserved
  sentence_digest: 6a944755a431121a64ed593fb590b73e5ef923302392fcc62e4ff1af6a91c8ed
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency decides what steps to segregate the record are reasonable.
  forbidden_example: A program decides that no further segregation is reasonable.
- id: foia.exemptions_closed_list
  sentence_digest: 563d88553314f1ab10c8ccc77efbd1872ca31ad8ccdfe0b9de5d0143c986dc91
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A withholding cites one of the exemptions (b)(1) through (b)(9).
  forbidden_example: A withholding cites an exemption that is not one of (b)(1) through (b)(9).
- id: foia.exemption_1
  sentence_digest: 2625b3ad1d0e13c26061d0d4ed72ecdd6c4ccbc0609faed3fa776fc947bccd89
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A withholding cites (b)(1) for a record that is matters specifically authorized under criteria established
    by an Executive order to be kept secret in the interest of national defense or foreign policy and in fact properly classified.
  forbidden_example: A withholding cites (b)(1) for a record that is not matters specifically authorized under criteria established
    by an Executive order to be kept secret in the interest of national defense or foreign policy and in fact properly classified.
- id: foia.exemption_2
  sentence_digest: 830c8039c1f08ea0ffdfb5814f575e48b1d2469c0ae3b54bf8bf3628af0c633b
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A withholding cites (b)(2) for a record that is matters related solely to the internal personnel rules
    and practices of an agency.
  forbidden_example: A withholding cites (b)(2) for a record that is not matters related solely to the internal personnel
    rules and practices of an agency.
- id: foia.exemption_3
  sentence_digest: 5c0d1c2832eea64aba4140229fec370a631c116129cf4510730e9dac02792b5d
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A withholding cites (b)(3) for a record that is matters specifically exempted from disclosure by a statute
    that meets the conditions in subparagraphs (A) and (B).
  forbidden_example: A withholding cites (b)(3) for a record that is not matters specifically exempted from disclosure by
    a statute that meets the conditions in subparagraphs (A) and (B).
- id: foia.exemption_4
  sentence_digest: 3d508093d40d5de79f4bdf92f1ef4a63e48398f73e115441b5ec806d3a8537f3
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A withholding cites (b)(4) for a record that is trade secrets and commercial or financial information obtained
    from a person and privileged or confidential.
  forbidden_example: A withholding cites (b)(4) for a record that is not trade secrets and commercial or financial information
    obtained from a person and privileged or confidential.
- id: foia.exemption_5
  sentence_digest: cbbb3c80c49c57c373595390b85a59794815d4ecddde0f4fd3560230efb5df13
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A withholding cites (b)(5) for a record that is inter-agency or intra-agency memorandums or letters not
    available by law to a party in litigation with the agency, with the 25-year limit on the deliberative process privilege.
  forbidden_example: A withholding cites (b)(5) for a record that is not inter-agency or intra-agency memorandums or letters
    not available by law to a party in litigation with the agency, with the 25-year limit on the deliberative process privilege.
- id: foia.exemption_6
  sentence_digest: 1c3e85c6e61e3b6edf70ec96cf3528c4d9288c8d2359743cfb9f4fa75b398ba7
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A withholding cites (b)(6) for a record that is personnel and medical files and similar files whose disclosure
    would constitute a clearly unwarranted invasion of personal privacy.
  forbidden_example: A withholding cites (b)(6) for a record that is not personnel and medical files and similar files whose
    disclosure would constitute a clearly unwarranted invasion of personal privacy.
- id: foia.exemption_7
  sentence_digest: 96d3a7072c4a10c0edcfa549555625c47847c93c44bd9bfd7499724e27901999
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A withholding cites (b)(7) for a record that is records or information compiled for law enforcement purposes,
    only to the extent of harms (A) through (F).
  forbidden_example: A withholding cites (b)(7) for a record that is not records or information compiled for law enforcement
    purposes, only to the extent of harms (A) through (F).
- id: foia.exemption_7_reserved
  sentence_digest: 96d3a7072c4a10c0edcfa549555625c47847c93c44bd9bfd7499724e27901999
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency decides whether producing the records could reasonably be expected to cause one of the harms
    in (b)(7)(A) through (F).
  forbidden_example: A program decides that producing the records could reasonably be expected to interfere with enforcement
    proceedings.
  note: Exemption 7 turns on what 'could reasonably be expected'; that judgment is the agency's and is routed, never decided
    by a rule.
- id: foia.exemption_8
  sentence_digest: bc4eab405fd5e4d56db086fb879ced965c64097a28776174204d4cd3054e52ad
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A withholding cites (b)(8) for a record that is matters contained in or related to examination, operating,
    or condition reports of an agency responsible for the regulation or supervision of financial institutions.
  forbidden_example: A withholding cites (b)(8) for a record that is not matters contained in or related to examination, operating,
    or condition reports of an agency responsible for the regulation or supervision of financial institutions.
- id: foia.exemption_9
  sentence_digest: 88d4bb486bed5acaa66a934e4abc8353e2bedba7610d9e251653191aaf5c9a54
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A withholding cites (b)(9) for a record that is geological and geophysical information and data, including
    maps, concerning wells.
  forbidden_example: A withholding cites (b)(9) for a record that is not geological and geophysical information and data,
    including maps, concerning wells.
- id: foia.segregable_provided
  sentence_digest: 5bfa3475672721bb87c69c4dc8e4d186dea3976db148f4f1a4be7ab138760109
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency releases the record with the exempt portions deleted and the rest provided.
  forbidden_example: The agency withholds the whole record without a segregability review.
- id: foia.segregable_reserved
  sentence_digest: 5bfa3475672721bb87c69c4dc8e4d186dea3976db148f4f1a4be7ab138760109
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: The agency decides which portions are reasonably segregable.
  forbidden_example: A program decides which portions are reasonably segregable.
- id: foia.deletion_indicated
  sentence_digest: 82fdbefc166206d7adcf49a807a931a88b11ba488471617763d0fd2f5fa708c0
  reviewer: session-assistant
  answer: true
  provisional: true
  allowed_example: A released record marks each deletion with its amount and the exemption claimed.
  forbidden_example: A released record shows deletions with no indication of the amount or the exemption, and no finding that
    marking them would cause harm.
