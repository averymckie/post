# ---------------------------------------------------------------- technical management practices
- name: Deployment management
  group: technical management
  deliverables:
  - name: deployment plan
    shape: ordered steps with phases
    instantiated_on: ordered steps of the Node.js governance document
    chain:
    - [ordered_steps, {of: nodejs-governance}]
    - [select, {fields: [phase, position, step]}]
    - [workbook, {name: deployment_plan}]
  - name: deployment records
    shape: deployments performed, with references
    instantiated_on: TSC minutes items mentioning release, deploy or land
    chain:
    - [minutes_sections, {}]
    - [filter, {where: [[item, matches, "(?i)\\b(release|deploy|land|ship)"]]}]
    - [select, {fields: [meeting, item, link]}]
    - [workbook, {name: deployment_records}]
  - name: environment inventory
    shape: the environments and who works in them
    instantiated_on: receipt-phase groups and resources
    chain:
    - [events, {}]
    - [group, {by: [group], aggregates: [[distinct, resource, resources], [count, "*", events]]}]
    - [workbook, {name: environments}]
  - name: rollback procedure
    shape: the ordered steps, reversed
    instantiated_on: ordered steps of the Node.js governance document
    chain:
    - [ordered_steps, {of: nodejs-governance}]
    - [sort, {by: [position], desc: true}]
    - [document, {name: rollback, title: "rollback: the steps in reverse order", columns: [position, step, sentence]}]

- name: Infrastructure and platform management
  group: technical management
  deliverables:
  - name: infrastructure inventory
    shape: groups, resources and activity counts
    instantiated_on: receipt-phase groups and resources
    chain:
    - [events, {}]
    - [pivot, {row: group, col: activity}]
    - [workbook, {name: infrastructure_inventory}]
  - name: runbook
    shape: the steps to perform, in order, with sources
    instantiated_on: ordered steps of 5 U.S.C. 552
    chain:
    - [ordered_steps, {of: usc5-552-doj}]
    - [document, {name: runbook, title: "runbook", columns: [position, phase, step, sentence]}]
  - name: utilization report
    shape: use per resource per period
    instantiated_on: receipt-phase events per resource per month
    chain:
    - [events, {}]
    - [derive, {field: month, fn: month, of: ts}]
    - [pivot, {row: resource, col: month}]
    - [workbook, {name: utilization}]

