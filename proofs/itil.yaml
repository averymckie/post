    chain:
    - [events, {}]
    - [select, {fields: [case, activity, ts, resource, department, channel]}]
    - [workbook, {name: event_records}]
  - name: monitoring thresholds
    shape: the threshold per group beyond which an alert is raised
    instantiated_on: receipt-phase department mean durations
    chain:
    - [cases, {}]
    - [group, {by: [department], aggregates: [[avg, duration_days, threshold_days], [count, "*", cases]]}]
    - [workbook, {name: thresholds}]
  - name: alert list
    shape: open items past threshold, decided by a rule
    instantiated_on: open receipt-phase cases against department means
    chain:
    - [cases, {}]
    - [group, {by: [department], aggregates: [[avg, duration_days, threshold_days]]}]
    - [save_as, {name: thresholds}]
    - [cases, {}]
    - [filter, {where: [[outcome, eq, open]]}]
    - [join, {with: thresholds, keys: [[department, department]]}]
    - [derive, {field: over, fn: ratio, num: days_since_last_event, den: threshold_days}]
    - [decision_table, {name: alert, inputs: [over], outputs: [alert], rules: [{when: {over: "> 1"}, then: {alert: "true"}, because: "idle longer than the department's mean case duration (P22)"}, {when: {}, then: {alert: "false"}, because: "otherwise"}]}]
    - [workbook, {name: alerts}]
  - name: event correlation
    shape: which events follow which, with counts
    instantiated_on: receipt-phase directly-follows edges
    chain:
    - [dfg, {}]
    - [workbook, {name: correlation}]

