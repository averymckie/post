# The ITIL surface as data: each practice, its deliverables, and the chain that produces each one.
# A chain is a list of [operation, parameters]; every operation is bound to library functions in proofs/itil.py.
# instantiated_on names the real input the chain ran on; "none" means no real input of that kind is available here.
practices:

# ---------------------------------------------------------------- general management practices
- name: Architecture management
  group: general management
  deliverables:
  - name: component dependency model
    shape: components and the dependencies between them, with the strength of each dependency
    instantiated_on: activities and directly-follows edges of the receipt-phase log
    chain:
    - [dfg, {}]
    - [sort, {by: [count], desc: true}]
    - [workbook, {name: dependency_model}]
  - name: architecture standards register
    shape: the standing rules a design must satisfy, each with its source sentence
    instantiated_on: obligations of the Node.js TSC charter
    chain:
    - [required_actions, {of: nodejs-tsc-charter}]
    - [select, {fields: [unit, who, action, sentence]}]
    - [workbook, {name: standards}]
  - name: architecture roadmap
    shape: steps grouped into phases in forced order
    instantiated_on: ordered steps of the Node.js governance document
    chain:
    - [ordered_steps, {of: nodejs-governance}]
    - [select, {fields: [phase, position, step, sentence]}]
    - [page, {name: roadmap, title: "roadmap: phases of the governance steps", kind: table}]
  - name: change impact assessment
    shape: for each component, everything that depends on it, transitively
    instantiated_on: forced precedence of 5 U.S.C. 552
    chain:
    - [forced_edges, {of: usc5-552-doj}]
    - [clingo, {in: edge, fields: [before, after, before_step, after_step], program: "dep(A,B) :- edge(A,B,_,_). dep(A,C) :- dep(A,B), edge(B,C,_,_). name(A,N) :- edge(A,_,N,_). name(B,N) :- edge(_,B,_,N). impact(A,N,K) :- name(A,N), K = #count{ B : dep(A,B) }, K > 0.", out: impact, out_fields: [component, step, dependents]}]
    - [sort, {by: [dependents], desc: true}]
    - [workbook, {name: impact}]

- name: Continual improvement
  group: general management
  deliverables:
  - name: improvement register
    shape: candidate improvements with where they were raised
    instantiated_on: TSC minutes sentences whose actions include improve, fix, rework, migrate, deprecate, remove or simplify
    chain:
    - [minutes_sentences, {}]
    - [filter, {where: [[lemmas, matches, "\\b(improve|fix|rework|migrate|deprecate|remove|simplify|unflag|enable)\\b"]]}]
    - [select, {fields: [meeting, sentence_id, lemmas, sentence]}]
    - [workbook, {name: improvement_register}]
  - name: improvement measurement
    shape: the measure before and after, per period
    instantiated_on: receipt-phase cases per month, mean duration and cases after deadline
    chain:
    - [cases, {}]
    - [derive, {field: late, fn: contains, of: outcome, value: after}]
    - [group, {by: [month], aggregates: [[count, "*", cases], [avg, duration_days, mean_days], [sum, late, after_deadline]]}]
    - [workbook, {name: measurement_by_month}]
  - name: improvement review report
    shape: conformance of the work to the model, per group
    instantiated_on: receipt-phase conformance joined to case departments
    chain:
    - [cases, {}]
    - [save_as, {name: cases}]
    - [conformance, {}]
    - [join, {with: cases, keys: [[case, case]]}]
    - [derive, {field: fit, fn: contains, of: is_fit, value: "true"}]
    - [group, {by: [department], aggregates: [[count, "*", cases], [sum, fit, fit_cases], [avg, fitness, mean_fitness]]}]
    - [document, {name: review_report, title: "review: fitness to the process model, per department"}]
  - name: improvement business case
    shape: cost and benefit of a proposed improvement
    instantiated_on: none
    chain:
    - [cases, {}]
    - [workbook, {name: business_case}]

- name: Information security management
  group: general management
  deliverables:
  - name: confidentiality obligations register
    shape: obligations about withholding, exempting or protecting information, with sources
    instantiated_on: 5 U.S.C. 552 sentences containing withhold, exempt, classified, confidential or privacy
    chain:
    - [required_actions, {of: usc5-552-doj}]
    - [filter, {where: [[sentence, matches, "(?i)withh|exempt|classif|confiden|privacy"]]}]
    - [select, {fields: [unit, who, action, sentence]}]
    - [workbook, {name: confidentiality_obligations}]
  - name: access control matrix
    shape: who is required to do what
    instantiated_on: agents and required actions of 5 U.S.C. 552
    chain:
    - [who_must_what, {of: usc5-552-doj}]
    - [pivot, {row: who, col: action, value: count, fn: sum}]
    - [workbook, {name: access_matrix}]
  - name: prohibitions register
    shape: what must not be done, with the sentence
    instantiated_on: negated obligations of 5 U.S.C. 552
    chain:
    - [prohibitions, {of: usc5-552-doj}]
    - [workbook, {name: prohibitions}]
  - name: security incident report
    shape: security releases with date, line and releaser
    instantiated_on: Node.js 22 changelog, releases marked as security releases
    chain:
    - [changelog, {}]
    - [filter, {where: [[security, eq, true]]}]
    - [select, {fields: [date, version, codename, kind, releaser, commits]}]
    - [document, {name: security_incidents, title: "security releases of Node.js 22"}]

- name: Knowledge management
  group: general management
  deliverables:
  - name: glossary
    shape: defined terms with their defining sentences
    instantiated_on: definitional sentences of 5 U.S.C. 552 (mean, include, define)
    chain:
    - [definitions, {of: usc5-552-doj}]
    - [select, {fields: [unit, verb, sentence]}]
    - [workbook, {name: glossary}]
  - name: knowledge article
    shape: a procedure written out in order with its sources
    instantiated_on: ordered steps of 5 U.S.C. 552
    chain:
    - [ordered_steps, {of: usc5-552-doj}]
    - [document, {name: knowledge_article, title: "the statutory steps, in forced order", columns: [position, step, sentence]}]
  - name: knowledge index
    shape: what each source contains, counted by kind
    instantiated_on: facts of the three procedure documents
    chain:
    - [facts, {of: usc5-552-doj}]
    - [group, {by: [predicate], aggregates: [[count, "*", facts]]}]
    - [workbook, {name: index_usc5_552}]
  - name: frequently discussed topics
    shape: the steps most often referred to in meetings
    instantiated_on: governance steps tagged in TSC minutes
    chain:
    - [tags, {of: nodejs-governance}]
    - [filter, {where: [[tie, eq, false]]}]
    - [group, {by: [step_lemma], aggregates: [[count, "*", mentions], [distinct, meeting, meetings]]}]
    - [sort, {by: [mentions], desc: true}]
    - [workbook, {name: topics}]

- name: Measurement and reporting
  group: general management
  deliverables:
  - name: KPI report
    shape: the agreed indicators per group and period
    instantiated_on: receipt-phase cases per department
    chain:
    - [cases, {}]
    - [derive, {field: late, fn: contains, of: outcome, value: after}]
    - [group, {by: [department], aggregates: [[count, "*", cases], [avg, duration_days, mean_days], [median, duration_days, median_days], [sum, late, after_deadline]]}]
    - [derive, {field: late_share, fn: ratio, num: after_deadline, den: cases}]
    - [workbook, {name: kpi_report}]
  - name: dashboard
    shape: the indicators as a chart page
    instantiated_on: receipt-phase events per activity
    chain:
    - [events, {}]
    - [group, {by: [activity], aggregates: [[count, "*", events]]}]
    - [page, {name: dashboard, title: "events per activity", kind: bar, x: activity, y: events}]
  - name: scorecard
    shape: pass or fail per period against a rule
    instantiated_on: majority reachable per TSC meeting
    chain:
    - [decisions, {}]
    - [page, {name: scorecard, title: "scorecard: could a vote carry at each meeting", kind: table}]
  - name: measurement plan
    shape: the clocks and durations the rules define
    instantiated_on: TIMEX3 durations found in 5 U.S.C. 552
    chain:
    - [anchors, {of: usc5-552-doj}]
    - [filter, {where: [[timex3, contains, DURATION]]}]
    - [distinct, {fields: [span, timex3, sentence]}]
    - [workbook, {name: measurement_plan}]

- name: Organizational change management
  group: general management
  deliverables:
  - name: stakeholder map
    shape: who takes part, in what role, how often
    instantiated_on: the Present lists of eight TSC meetings
    chain:
    - [participants, {}]
    - [group, {by: [name, role], aggregates: [[count, "*", meetings]]}]
    - [sort, {by: [meetings], desc: true}]
    - [workbook, {name: stakeholders}]
  - name: communication log
    shape: announcements and updates made to the group, by date
    instantiated_on: Announcements and update sections of the TSC minutes
    chain:
    - [minutes_sections, {}]
    - [filter, {where: [[section, matches, "(?i)announce|update"]]}]
    - [select, {fields: [meeting, section, item, link]}]
    - [workbook, {name: communications}]
  - name: readiness assessment
    shape: whether the group can decide, per occasion
    instantiated_on: majority reachable per TSC meeting
    chain:
    - [decisions, {}]
    - [workbook, {name: readiness}]
  - name: training records
    shape: who was trained in what, when
    instantiated_on: none
    chain:
    - [participants, {}]
    - [workbook, {name: training}]

- name: Portfolio management
  group: general management
  deliverables:
  - name: portfolio register
    shape: the items under consideration, with references
    instantiated_on: agenda items with links in the TSC minutes
    chain:
    - [minutes_sections, {}]
    - [filter, {where: [[links, gt, 0]]}]
    - [select, {fields: [meeting, section, item, link]}]
    - [workbook, {name: portfolio}]
  - name: prioritization matrix
    shape: items ranked by how often they recur
    instantiated_on: links recurring across TSC meetings
    chain:
    - [minutes_sections, {}]
    - [filter, {where: [[link, notnull, ""]]}]
    - [group, {by: [link], aggregates: [[distinct, meeting, meetings], [count, "*", mentions]]}]
    - [sort, {by: [meetings, mentions], desc: true}]
    - [workbook, {name: prioritization}]
  - name: portfolio review
    shape: the items per section per meeting
    instantiated_on: TSC minutes sections
    chain:
    - [minutes_sections, {}]
    - [pivot, {row: section, col: meeting}]
    - [page, {name: portfolio_review, title: "items per section per meeting", kind: table}]

- name: Project management
  group: general management
  deliverables:
  - name: project charter
    shape: purpose, responsibilities and rules of the undertaking
    instantiated_on: the Node.js TSC charter's obligations
    chain:
    - [required_actions, {of: nodejs-tsc-charter}]
    - [document, {name: charter, title: "charter: what the TSC must do", columns: [unit, who, action, sentence]}]
  - name: project schedule
    shape: work packages in phases
    instantiated_on: ordered steps of 5 U.S.C. 552 by phase
    chain:
    - [ordered_steps, {of: usc5-552-doj}]
    - [select, {fields: [phase, position, step, unit]}]
    - [workbook, {name: schedule}]
  - name: status report
    shape: open, closed and late work per period
    instantiated_on: receipt-phase cases per month
    chain:
    - [cases, {}]
    - [pivot, {row: month, col: outcome}]
    - [document, {name: status_report, title: "status by month: open, by deadline, after deadline"}]
  - name: RAID log
    shape: risks, assumptions, issues and dependencies raised
    instantiated_on: TSC minutes sentences mentioning risk, block, issue, depend or concern
    chain:
    - [minutes_sentences, {}]
    - [filter, {where: [[sentence, matches, "(?i)\\b(risk|block|blocker|issue|depend|concern)"]]}]
    - [select, {fields: [meeting, sentence_id, sentence]}]
    - [workbook, {name: raid_log}]

- name: Relationship management
  group: general management
  deliverables:
  - name: stakeholder register
    shape: parties, their standing and contact points
    instantiated_on: TSC voting members joined with meeting participants
    chain:
    - [participants, {}]
    - [group, {by: [handle], aggregates: [[count, "*", meetings_attended], [min, name, name]]}]
    - [save_as, {name: attended}]
    - [records, {of: tsc-voting-members}]
    - [join, {with: attended, keys: [[handle, handle]], how: left}]
    - [workbook, {name: stakeholder_register}]
  - name: decision log
    shape: decisions taken with the meeting where they were taken
    instantiated_on: TSC minutes sentences whose actions include agree, approve, vote, decide, resolve or consensus
    chain:
    - [minutes_sentences, {}]
    - [filter, {where: [[lemmas, matches, "\\b(agree|approve|vote|decide|resolve|consensus|object)\\b"]]}]
    - [select, {fields: [meeting, sentence_id, lemmas, sentence]}]
    - [workbook, {name: decision_log}]
  - name: satisfaction report
    shape: satisfaction measured per party
    instantiated_on: none
    chain:
    - [participants, {}]
    - [workbook, {name: satisfaction}]

- name: Risk management
  group: general management
  deliverables:
  - name: risk register
    shape: open items exposed beyond their group's norm
    instantiated_on: open receipt-phase cases against their department's mean duration
    chain:
    - [cases, {}]
    - [group, {by: [department], aggregates: [[avg, duration_days, mean_days]]}]
    - [save_as, {name: means}]
    - [cases, {}]
    - [filter, {where: [[outcome, eq, open]]}]
    - [join, {with: means, keys: [[department, department]]}]
    - [derive, {field: exposure, fn: ratio, num: days_since_last_event, den: mean_days}]
    - [sort, {by: [exposure], desc: true}]
    - [workbook, {name: risk_register}]
  - name: risk matrix
    shape: likelihood against impact per group
    instantiated_on: receipt-phase departments, share late against mean duration
    chain:
    - [cases, {}]
    - [derive, {field: late, fn: contains, of: outcome, value: after}]
    - [group, {by: [department], aggregates: [[count, "*", cases], [sum, late, late_cases], [avg, duration_days, impact_days]]}]
    - [derive, {field: likelihood, fn: ratio, num: late_cases, den: cases}]
    - [page, {name: risk_matrix, title: "likelihood of lateness against mean duration", kind: scatter, x: likelihood, y: impact_days, size: cases}]
  - name: risk report
    shape: the register summarized for review
    instantiated_on: receipt-phase departments
    chain:
    - [cases, {}]
    - [derive, {field: late, fn: contains, of: outcome, value: after}]
    - [group, {by: [department, channel], aggregates: [[count, "*", cases], [sum, late, late_cases]]}]
    - [derive, {field: late_share, fn: ratio, num: late_cases, den: cases}]
    - [document, {name: risk_report, title: "lateness by department and channel"}]

- name: Service financial management
  group: general management
  deliverables:
  - name: fee rules register
    shape: the rules under which charges are made
    instantiated_on: fee provisions of 5 U.S.C. 552
    chain:
    - [required_actions, {of: usc5-552-doj}]
    - [filter, {where: [[sentence, matches, "(?i)\\bfee"]]}]
    - [select, {fields: [unit, who, action, sentence]}]
    - [workbook, {name: fee_rules}]
  - name: budget
    shape: planned spend per period and cost centre
    instantiated_on: OMB budget authority per agency, fiscal years 2016 to 2021 (FY2017 President's Budget database)
    chain:
    - [budget, {of: budauth}]
    - [group, {by: [agency_name], aggregates: [[sum, y2016, fy2016], [sum, y2017, fy2017], [sum, y2018, fy2018], [sum, y2019, fy2019], [sum, y2020, fy2020], [sum, y2021, fy2021], [count, "*", accounts]]}]
    - [sort, {by: [fy2017], desc: true}]
    - [workbook, {name: budget}]
  - name: cost model
    shape: cost per account within each bureau, and the bureau's total
    instantiated_on: OMB budget authority, fiscal year 2017, by bureau and account
    chain:
    - [budget, {of: budauth}]
    - [group, {by: [agency_name, bureau_name], aggregates: [[sum, y2017, bureau_fy2017]]}]
    - [save_as, {name: bureaus}]
    - [budget, {of: budauth}]
    - [join, {with: bureaus, keys: [[agency_name, agency_name], [bureau_name, bureau_name]]}]
    - [derive, {field: share_of_bureau, fn: ratio, num: y2017, den: bureau_fy2017}]
    - [select, {fields: [agency_name, bureau_name, account_name, bea_category, y2017, bureau_fy2017, share_of_bureau]}]
    - [sort, {by: [y2017], desc: true}]
    - [workbook, {name: cost_model}]
  - name: chargeback report
    shape: what each consumer is charged, as its share of the whole
    instantiated_on: OMB outlays per agency and bureau, fiscal year 2017, as shares of the agency's outlays
    chain:
    - [budget, {of: outlays}]
    - [group, {by: [agency_name], aggregates: [[sum, y2017, agency_fy2017]]}]
    - [save_as, {name: agencies}]
    - [budget, {of: outlays}]
    - [group, {by: [agency_name, bureau_name], aggregates: [[sum, y2017, bureau_fy2017]]}]
    - [join, {with: agencies, keys: [[agency_name, agency_name]]}]
    - [derive, {field: share, fn: ratio, num: bureau_fy2017, den: agency_fy2017}]
    - [sort, {by: [bureau_fy2017], desc: true}]
    - [workbook, {name: chargeback}]

- name: Strategy management
  group: general management
  deliverables:
  - name: objectives register
    shape: the standing commitments of the organization
    instantiated_on: obligations of the Node.js governance document
    chain:
    - [required_actions, {of: nodejs-governance}]
    - [select, {fields: [unit, who, action, sentence]}]
    - [workbook, {name: objectives}]
  - name: strategic roadmap
    shape: phases and steps
    instantiated_on: ordered steps of the Node.js governance document
    chain:
    - [ordered_steps, {of: nodejs-governance}]
    - [group, {by: [phase], aggregates: [[count, "*", steps], [list, step, steps_in_phase]]}]
    - [workbook, {name: strategic_roadmap}]
  - name: strategy review
    shape: what the leadership discussed, by topic
    instantiated_on: charter actions tagged in TSC minutes
    chain:
    - [tags, {of: nodejs-tsc-charter}]
    - [filter, {where: [[tie, eq, false]]}]
    - [pivot, {row: step_lemma, col: meeting}]
    - [workbook, {name: strategy_review}]

- name: Supplier management
  group: general management
  deliverables:
  - name: third-party obligations register
    shape: obligations toward or from external parties
    instantiated_on: TSC charter sentences naming the CPC or the Foundation
    chain:
    - [required_actions, {of: nodejs-tsc-charter}]
    - [filter, {where: [[sentence, matches, "CPC|Foundation|Board"]]}]
    - [select, {fields: [unit, who, action, sentence]}]
    - [workbook, {name: third_party_obligations}]
  - name: supplier register
    shape: external components relied on, with their license
    instantiated_on: Node.js maintained dependencies joined to the LICENSE register
    chain:
    - [licenses, {}]
    - [derive, {field: key, fn: upper, of: component}]
    - [save_as, {name: lic}]
    - [dependencies, {}]
    - [derive, {field: key, fn: upper, of: dependency}]
    - [join, {with: lic, keys: [[key, key]], how: left}]
    - [select, {fields: [dependency, component, location, license_heading]}]
    - [workbook, {name: suppliers}]
  - name: supplier performance report
    shape: how often each supplied component had to be updated, and when
    instantiated_on: dependency update commits in the Node.js 22 changelog
    chain:
    - [changelog_commits, {}]
    - [filter, {where: [[scope, eq, deps], [message, matches, "^(update|upgrade|bump) "]]}]
    - [derive, {field: component, fn: word, of: message, n: 2}]
    - [group, {by: [component], aggregates: [[count, "*", updates], [min, date, first_update], [max, date, last_update], [distinct, version, releases]]}]
    - [sort, {by: [updates], desc: true}]
    - [workbook, {name: supplier_performance}]

- name: Workforce and talent management
  group: general management
  deliverables:
  - name: roles and responsibilities
    shape: who must do what
    instantiated_on: agents and required actions of the TSC charter
    chain:
    - [who_must_what, {of: nodejs-tsc-charter}]
    - [workbook, {name: roles}]
  - name: attendance report
    shape: participation per occasion
    instantiated_on: voting members present at eight TSC meetings
    chain:
    - [attendance, {}]
    - [page, {name: attendance, title: "voting members present per meeting", kind: bar, x: meeting, y: present_voting}]
  - name: workload report
    shape: work handled per person
    instantiated_on: receipt-phase events per resource
    chain:
    - [events, {}]
    - [group, {by: [resource], aggregates: [[count, "*", events], [distinct, case, cases], [distinct, activity, activities]]}]
    - [sort, {by: [events], desc: true}]
    - [workbook, {name: workload}]
  - name: skills matrix
    shape: people against skills
    instantiated_on: receipt-phase resources against the activities they performed
    chain:
    - [events, {}]
    - [pivot, {row: resource, col: activity}]
    - [workbook, {name: skills_matrix}]

# ---------------------------------------------------------------- service management practices
- name: Availability management
  group: service management
  deliverables:
  - name: availability requirements
    shape: the time limits the rules impose
    instantiated_on: durations in 5 U.S.C. 552 with their sentences
    chain:
    - [anchors, {of: usc5-552-doj}]
    - [filter, {where: [[timex3, contains, DURATION]]}]
    - [select, {fields: [span, timex3, sentence]}]
    - [distinct, {}]
    - [workbook, {name: availability_requirements}]
  - name: availability report
    shape: achieved availability per period
    instantiated_on: share of voting members available per TSC meeting
    chain:
    - [decisions, {}]
    - [derive, {field: availability, fn: ratio, num: present_voting, den: present_voting}]
    - [select, {fields: [meeting, present_voting, majority_reachable]}]
    - [workbook, {name: availability_report}]
  - name: availability plan
    shape: the windows in which each service line is supported
    instantiated_on: Node.js release lines with start, LTS, maintenance and end dates
    chain:
    - [release_schedule, {}]
    - [derive, {field: supported_days, fn: days_between, a: start, b: end}]
    - [workbook, {name: availability_plan}]

- name: Business analysis
  group: service management
  deliverables:
  - name: requirements catalogue
    shape: every requirement with its source and owner
    instantiated_on: obligations of 5 U.S.C. 552
    chain:
    - [required_actions, {of: usc5-552-doj}]
    - [select, {fields: [unit, who, action, sentence]}]
    - [workbook, {name: requirements}]
  - name: as-is process model
    shape: the process as performed
    instantiated_on: receipt-phase directly-follows edges
    chain:
    - [dfg, {}]
    - [workbook, {name: as_is_process}]
  - name: gap analysis
    shape: requirements present in one source and absent in another
    instantiated_on: required actions of the TSC charter against the governance document
    chain:
    - [required_actions, {of: nodejs-tsc-charter}]
    - [select, {fields: [action]}]
    - [distinct, {}]
    - [save_as, {name: charter}]
    - [required_actions, {of: nodejs-governance}]
    - [select, {fields: [action]}]
    - [distinct, {}]
    - [join, {with: charter, keys: [[action, action]], how: left}]
    - [workbook, {name: gap_analysis}]
  - name: acceptance criteria
    shape: each required action with its clock
    instantiated_on: 5 U.S.C. 552 obligations joined to durations in the same sentence
    chain:
    - [anchors, {of: usc5-552-doj}]
    - [filter, {where: [[timex3, contains, DURATION]]}]
    - [save_as, {name: clocks}]
    - [required_actions, {of: usc5-552-doj}]
    - [join, {with: clocks, keys: [[sentence_id, sentence_id]]}]
    - [select, {fields: [unit, who, action, span, timex3, sentence]}]
    - [workbook, {name: acceptance_criteria}]

- name: Capacity and performance management
  group: service management
  deliverables:
  - name: capacity plan
    shape: demand per period and group
    instantiated_on: receipt-phase events per month and department
    chain:
    - [events, {}]
    - [derive, {field: month, fn: month, of: ts}]
    - [pivot, {row: month, col: department}]
    - [workbook, {name: capacity_plan}]
  - name: performance report
    shape: duration statistics per group
    instantiated_on: receipt-phase cases per department
    chain:
    - [cases, {}]
    - [group, {by: [department], aggregates: [[count, "*", cases], [min, duration_days, min_days], [median, duration_days, median_days], [avg, duration_days, mean_days], [max, duration_days, max_days]]}]
    - [workbook, {name: performance_report}]
  - name: demand trend
    shape: cases started per month
